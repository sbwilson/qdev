[package]
name = "qdev-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface and entrypoint for qdev"

[[bin]]
name = "qdev"
path = "src/main.rs"

[dependencies]
qdev-core = { path = "../qdev-core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
jsonschema = { version = "0.54", default-features = false }
