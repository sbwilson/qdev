[package]
name = "qdev-core"
version = "0.1.0"
edition = "2021"
description = "Core domain models, envelope contracts, error taxonomy, and state machine for qdev"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
rand = "0.9"


[dev-dependencies]
proptest = "1.11.0"
regex = "1.11"
tempfile = "3.10"
